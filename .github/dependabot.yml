version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      electron-forge:
        patterns:
          - '@electron-forge/*'
      # The packages share one version: each requires vitest at exactly its own, so a bump of one
      # alone fails `npm ci` with ERESOLVE (the first proposal for 5.0.3 did).
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      storybook:
        patterns:
          - '@storybook/*'
          - storybook
      webdriverio:
        patterns:
          - '@wdio/*'

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      playwright:
        patterns:
          - '@playwright/test'
          - '@axe-core/playwright'
    ignore:
      # @astrojs/check accepts TypeScript 5 and 6 only as its peer, so a TypeScript 7 bump makes
      # `npm ci` fail with ERESOLVE (the site's checks did, on the first proposal). Remove this when
      # a release of @astrojs/check lists 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # The mutation-testing tool is a package of its own (see CONTRIBUTING); its two packages share one
  # version, as Stryker's runner requires its core at exactly its own.
  - package-ecosystem: npm
    directory: /tests/mutation
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      stryker:
        patterns:
          - '@stryker-mutator/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
