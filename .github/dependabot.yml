version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      electron-forge:
        patterns:
          - '@electron-forge/*'
      # The packages share one version: each requires vitest at exactly its own, so a bump of one
      # alone fails `npm ci` with ERESOLVE (the first proposal for 5.0.3 did).
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      storybook:
        patterns:
          - '@storybook/*'
          - storybook
      # Both are pinned, each at the same version. A bump of one alone leaves two copies of
      # Playwright in the tree: `npx playwright install` then fetches the browsers of one while the
      # tests launch the other, and every Quality job fails (the first proposal for 1.64.0 did).
      playwright:
        patterns:
          - '@playwright/test'
          - playwright
      webdriverio:
        patterns:
          - '@wdio/*'
    ignore:
      # WebdriverIO 10 needs expect-webdriverio 8, and @wdio/electron-service (10.x is its own line,
      # not WebdriverIO's) still depends on @wdio/globals 9: a group with the 10s fails `npm ci` with
      # ERESOLVE (the first proposal, for 10.0.2, did). The service is left out of this list on
      # purpose, since its own majors are the ones that will say WebdriverIO 10 is supported. Remove
      # this when a release of it lists @wdio/globals 10.
      - dependency-name: '@wdio/cli'
        update-types: ['version-update:semver-major']
      - dependency-name: '@wdio/globals'
        update-types: ['version-update:semver-major']
      - dependency-name: '@wdio/local-runner'
        update-types: ['version-update:semver-major']
      - dependency-name: '@wdio/mocha-framework'
        update-types: ['version-update:semver-major']
      - dependency-name: '@wdio/spec-reporter'
        update-types: ['version-update:semver-major']
      - dependency-name: '@wdio/types'
        update-types: ['version-update:semver-major']
      - dependency-name: webdriverio
        update-types: ['version-update:semver-major']
      - dependency-name: expect-webdriverio
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      playwright:
        patterns:
          - '@playwright/test'
          - '@axe-core/playwright'
    ignore:
      # @astrojs/check accepts TypeScript 5 and 6 only as its peer, so a TypeScript 7 bump makes
      # `npm ci` fail with ERESOLVE (the site's checks did, on the first proposal). Remove this when
      # a release of @astrojs/check lists 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # The mutation-testing tool is a package of its own (see CONTRIBUTING); its two packages share one
  # version, as Stryker's runner requires its core at exactly its own.
  - package-ecosystem: npm
    directory: /tests/mutation
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      stryker:
        patterns:
          - '@stryker-mutator/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
