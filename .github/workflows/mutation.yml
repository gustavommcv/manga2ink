name: Mutation testing

# Changes the code of every layer that holds logic one thing at a time, and says how many of the
# changes a test noticed (tests/mutation/README.md). Coverage says a line ran; this says whether a
# test would have failed if it were wrong. It takes hours, so it runs once a week and on
# request, never on a pull request, and it is not a gate: the score is published in the summary of the
# run and the reports are kept for a month, for whoever wants to read what survived.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  mutation:
    name: Mutation score
    runs-on: ubuntu-latest
    # About two hours on a machine of eight cores; the runner has four.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tests/mutation
      # Two of the tests run the real bundled tools, and the sandbox of the run holds them.
      - run: npm run toolchain:acquire
      - name: Run mutation testing
        run: npm run test:mutation 2>&1 | tee mutation.log
      - name: Say the score
        if: always()
        run: |
          {
            echo '## Mutation score'
            echo
            sed -E 's/\x1b\[[0-9;]*m//g' mutation.log | grep -E 'of [0-9]+ changes were noticed' || echo 'The run did not finish.'
            echo
            echo 'The lowest scores, by file:'
            echo
            echo '```text'
            sed -E 's/\x1b\[[0-9;]*m//g' mutation.log | sed -n '/^=== Summary/,$p' | grep -E '^ *[0-9.]+% ' | sort -n | head -15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-reports
          path: |
            mutation.log
            tests/mutation/reports/
          retention-days: 30
          if-no-files-found: ignore
