name: Make installers

# Shared by ci.yml's make-verification job and release.yml's build job, so the two never drift the
# way they once did (a SHA-pinning pass updated this job in one file and missed it in the other,
# since they were separate copies). Nothing here talks to the GitHub Releases API; that stays the
# exclusive job of release.yml's own publish job, downstream of this one.
on:
  workflow_call:
    inputs:
      artifact-name-prefix:
        required: true
        type: string
      run-sandbox-diagnostic:
        description: 'Run the Linux sandbox diagnostic step (ci.yml only; not a release gate).'
        required: false
        type: boolean
        default: false

jobs:
  make:
    name: Make installer (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-latest
            runner: windows-latest
          - name: ubuntu-latest
            runner: ubuntu-latest
          # Pinned, not macos-latest: that alias has already moved from Intel to Apple Silicon
          # once, silently, and this repo ships arm64-only for the alpha. A fixed, non-deprecated
          # label keeps the architecture an explicit choice, not a default that drifts whenever
          # GitHub repoints -latest.
          - name: macos-15-arm64
            runner: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache the pinned mangabind/mangapress binaries
        # Keyed on the lock file's own hash plus OS, so a change to either pin is a cache miss, not
        # a stale hit - acquire-toolchain.mjs itself re-verifies every byte against the lock before
        # trusting a cache restore, so a corrupted or tampered cache still falls back to a real
        # download rather than being trusted.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('toolchain.lock.json') }}
      - name: Install Linux maker dependencies
        if: runner.os == 'Linux'
        # MakerRpm needs the `rpmbuild` binary (apt's `rpm` package provides it on
        # Debian/Ubuntu - there is no separate "rpmbuild" package there); MakerDeb needs
        # `dpkg` (already present on any Debian-family runner) and `fakeroot`. `cpio` goes with
        # `rpm2cpio`, which unpacks the .rpm for check-package-tools.sh.
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install --yes rpm fakeroot cpio
      - run: npm run make
      - name: Upload installer artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name-prefix }}${{ matrix.name }}
          path: out/make/**
          if-no-files-found: error
      - name: Check that the Linux packages can be used by someone who is not root
        # A gate, unlike the diagnostic below: packages are installed by root and run by a person,
        # and a bundled tool in a folder only root can enter installs fine and then keeps every
        # conversion from starting. Reads the listing of each finished package, so it checks what
        # would be installed.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mapfile -t packages < <(find out/make -type f \( -name '*.deb' -o -name '*.rpm' \))
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "::error::No .deb or .rpm found under out/make to check."
            exit 1
          fi
          .github/scripts/check-package-permissions.sh "${packages[@]}"
      - name: Check that the bundled tools in the Linux packages are the pinned ones
        # A gate: the app hashes mangabind and mangapress on every start and refuses to convert
        # when either is not byte for byte the file in toolchain.lock.json. rpmbuild strips and
        # edits ELF files unless told not to (packaging/rpm/spec.ejs), and an edited tool installs
        # without a word. Unpacks each finished package, so it checks what would be installed.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mapfile -t packages < <(find out/make -type f \( -name '*.deb' -o -name '*.rpm' \))
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "::error::No .deb or .rpm found under out/make to check."
            exit 1
          fi
          .github/scripts/check-package-tools.sh "${packages[@]}"
      - name: 'Diagnostic: launch the real .deb with the sandbox enabled'
        if: inputs.run-sandbox-diagnostic && runner.os == 'Linux'
        # Not a release gate (always exits 0) - purely to observe and record real behavior before
        # anyone documents a workaround for a problem that might not even apply here. Every other
        # Electron launch in this repo's CI runs with --no-sandbox (see wdio.conf.ts); this is the
        # one place that deliberately does not, so the result reflects what a real user gets.
        shell: bash
        run: .github/scripts/check-deb-sandbox.sh
